<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Malcom Blog</title>
  <style>
    /* --- VARIABLES & RESET --- */
    :root {
      --primary-color: darkorchid;
      --text-color: #ffffff;
      --bg-gradient: linear-gradient(to bottom, var(--primary-color), #2c0b4d);
      --glass-bg: rgba(255, 255, 255, 0.1);
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg-gradient);
      color: var(--text-color);
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* --- CONTENEUR PRINCIPAL (GLASSMORPHISM) --- */
    .main-card {
      background: var(--glass-bg);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 40px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
      text-align: center;
    }

    /* --- TYPOGRAPHIE --- */
    h1 {
      font-size: 2.5rem;
      margin-bottom: 5px;
      letter-spacing: -1px;
    }

    .surname {
      font-weight: 300;
      opacity: 0.8;
      text-transform: uppercase;
    }

    .divider {
      height: 4px;
      width: 50px;
      background: white;
      margin: 20px auto;
      border-radius: 2px;
    }

    /* --- LISTE DE CONTACT --- */
    .contact-list {
      list-style: none;
      padding: 0;
      margin: 30px 0;
      text-align: left;
    }

    .contact-list li {
      margin: 15px 0;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.1rem;
    }

    /* --- IMAGE --- */
    .profile-img {
      width: 100%;
      max-width: 300px;
      border-radius: 15px;
      margin-top: 20px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
      transition: transform 0.3s ease;
    }

    .profile-img:hover {
      transform: translateY(-10px) rotate(2deg);
    }

    /* --- BOUTON D'ACTION --- */
    .cta-button {
      display: inline-block;
      margin-top: 25px;
      padding: 12px 30px;
      background: white;
      color: var(--primary-color);
      text-decoration: none;
      font-weight: bold;
      border-radius: 30px;
      transition: 0.3s;
    }

    .cta-button:hover {
      background: var(--primary-color);
      color: white;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
    }
  </style>
</head>

<body>

  <div class="main-card">
    <header>
      <h1>Malcom <span class="surname">Tossou</span></h1>
      <div class="divider"></div>
    </header>

    <ul class="contact-list">
      <li>📍 <span>123 Rue du Code, 75000 Paris</span></li>
      <li>📞 <span>+33 6 00 00 00 00</span></li>
      <li>✉️ <span>malcom@exemple.com</span></li>
    </ul>

    <div class="image-container">
      <img src="https://images7.alphacoders.com/132/1329443.jpg" alt="Luffy Crew" class="profile-img">
    </div>

    <a href="mailto:malcom@exemple.com" class="cta-button">Me Contacter</a>

    <footer>
      <p style="font-size: 0.8rem; margin-top: 30px; opacity: 0.6;">
        © 2026 — Créé par Malcom, être à part entière.
      </p>
    </footer>
  </div>

</body>

</html>
